name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Guards the bundled GeoJSON/admin data against corruption and against
      # structural regressions introduced by a DataV refresh.
      - name: Validate bundled data
        run: python scripts/validate_data.py

      - name: Check line endings
        run: python scripts/check_line_endings.py

      # Two copies of a spec that can disagree are worse than one. Each
      # translation records the hash of the source it was written from.
      - name: Check translations are in sync
        run: python scripts/check_translations.py

      # L0 (RFC-002): checks the built artifact, not its behaviour. Conformance
      # only reaches a file that loads at all.
      - name: Validate the shipped dataset
        run: python scripts/validate_gtc.py --round-trip

      # All three tiers are a documented contract (SPEC §4.1), so all three must
      # build and validate — otherwise only `full` is ever really exercised.
      - name: Build and validate every tier
        run: |
          for tier in mini lite; do
            python pipeline/build_gtc.py --dataset "$tier" --out "/tmp/china.$tier.gtc"
            python scripts/validate_gtc.py "/tmp/china.$tier.gtc"
          done

      - name: A geometry-free dataset must refuse geometry calls
        run: |
          python - <<'PY'
          from GeoToolCN._gtc import GTCData, GeometryUnavailable
          data = GTCData("/tmp/china.mini.gtc")
          assert not data.has_geometry
          assert data.record_count == 3271
          try:
              data.locate(39.9, 116.4)
          except GeometryUnavailable:
              print("mini correctly refuses geometry lookups")
          else:
              raise SystemExit("mini answered a geometry query without geometry")
          PY

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The contract every port is held to. Failures here mean either a
      # regression or an entry missing from conformance/known-divergences.yaml.
      - name: Run conformance suite
        run: python conformance/run.py

      # The suite is generated from this implementation, so it must still match.
      # Compared per file rather than with `git diff`: coords.jsonl holds sin/cos
      # results at 12 decimals, and libm differs between platforms in the last
      # digits, so byte-equality would fail on a correct file.
      - name: Check the suite is up to date
        run: python conformance/generate.py --check

  no-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The whole point of version 3. Installing without extras must pull in
      # nothing, and the package must work with geopandas absent entirely.
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Everything below runs from /tmp on purpose. Run from the checkout and
      # `import GeoToolCN` resolves to the source tree — which carries the 28 MB
      # of GeoJSON the wheel deliberately excludes — so the check would measure
      # the repository instead of the installed package.
      - name: Assert no third-party dependencies
        working-directory: /tmp
        run: |
          REQUIRES=$(pip show geotool-cn | grep '^Requires:' | cut -d: -f2- | tr -d ' ')
          if [ -n "$REQUIRES" ]; then
            echo "::error::geotool-cn should have no runtime dependencies, got: $REQUIRES"
            exit 1
          fi
          python - <<'PY'
          import sys
          import GeoToolCN
          if "geopandas" in sys.modules or "shapely" in sys.modules:
              raise SystemExit("importing GeoToolCN pulled in the geospatial stack")
          for blocked in ("geopandas", "shapely", "pandas", "numpy"):
              sys.modules[blocked] = None      # force ImportError on use
          result = GeoToolCN.reverse(39.9042, 116.4074)
          assert result.district.name == "东城区", result
          assert len(GeoToolCN.get_administrative_tree()) == 34
          print(f"ok, no geospatial stack required — {GeoToolCN.__file__}")
          PY

      # __version__ was a literal in __init__.py while release.yml rewrites the
      # version in pyproject.toml from the tag, so 3.0.0rc1 shipped reporting
      # itself as 2.1.0. Only a real install catches this: in the source tree
      # both numbers are whatever was last committed, so they agree by accident.
      - name: The reported version must match the installed one
        working-directory: /tmp
        run: |
          python - <<'PY'
          from importlib.metadata import version
          import GeoToolCN
          installed = version("geotool-cn")
          assert GeoToolCN.__version__ == installed, (
              f"__version__ says {GeoToolCN.__version__}, pip installed {installed}"
          )
          assert not GeoToolCN.__version__.startswith("0.0.0"), (
              "a real install fell back to the source-tree placeholder"
          )
          print(f"version agrees: {installed}")
          PY

      - name: Report installed size
        working-directory: /tmp
        run: |
          python - <<'PY'
          import os, sysconfig
          import GeoToolCN
          root = os.path.dirname(GeoToolCN.__file__)
          if not root.startswith(sysconfig.get_paths()["purelib"]):
              raise SystemExit(f"measured the source tree, not the install: {root}")
          total = sum(
              os.path.getsize(os.path.join(dirpath, name))
              for dirpath, _, names in os.walk(root)
              for name in names
          )
          print(f"installed: {total / 1048576:.2f} MB at {root}")
          assert total < 8 * 1048576, f"package grew beyond 8 MB ({total / 1048576:.2f} MB)"
          PY

  # release.yml only ever runs on a real tag, so until this existed every line
  # in it was first executed by the release it was meant to perform. That is how
  # `npm version` shipped: it exits 1 with "Version not changed" when the repo
  # already holds the version being released, which is the normal case.
  release-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the gate's ancestry check needs origin/master
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Setting the version the repository already has must succeed
        run: |
          CURRENT_PY=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          CURRENT_NODE=$(node -p "require('./packages/node/package.json').version")
          echo "repository holds python=$CURRENT_PY node=$CURRENT_NODE"
          bash scripts/set_release_version.sh python "$CURRENT_PY"
          bash scripts/set_release_version.sh node "$CURRENT_NODE"

      - name: Setting a different version must actually change it
        run: |
          bash scripts/set_release_version.sh python 9.9.9rc1
          bash scripts/set_release_version.sh node 9.9.9-rc.1
          grep -q '^version = "9.9.9rc1"$' pyproject.toml
          test "$(node -p "require('./packages/node/package.json').version")" = "9.9.9-rc.1"

      - name: And must leave both manifests parseable
        run: |
          python -c "import tomllib; tomllib.load(open('pyproject.toml','rb'))"
          test "$(node -p "require('./packages/node/package.json').name")" = "@geotoolcn/core"

      # The gate decides whether a tag may publish. Its refusals are the
      # interesting part: each one below is a release that once went out (or
      # nearly did) because nothing checked it.
      - name: The release gate accepts the versions the repository holds
        run: |
          git checkout -- pyproject.toml packages/node/package.json
          CURRENT_PY=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          CURRENT_NODE=$(node -p "require('./packages/node/package.json').version")
          GO_MAJOR=$(head -1 packages/go/go.mod | sed -n 's#.*/\(v[0-9]*\)$#\1#p')
          bash scripts/release_gate.sh "py-v$CURRENT_PY" --skip-ancestry | grep -qx "ecosystem=python"
          bash scripts/release_gate.sh "npm-v$CURRENT_NODE" --skip-ancestry | grep -qx "prerelease=false"
          bash scripts/release_gate.sh "packages/go/$GO_MAJOR.99.0" --skip-ancestry | grep -qx "ecosystem=go"
          bash scripts/release_gate.sh "cli-v9.9.9rc1" --skip-ancestry | grep -qx "prerelease=true"

      - name: And refuses a tag that disagrees with the tree
        run: |
          ! bash scripts/release_gate.sh py-v0.0.1 --skip-ancestry
          ! bash scripts/release_gate.sh npm-v0.0.1 --skip-ancestry
          ! bash scripts/release_gate.sh packages/go/v99.0.0 --skip-ancestry
          ! bash scripts/release_gate.sh v3.0.0 --skip-ancestry
          # A commit that is not on the base branch must not publish either.
          git -c user.name=ci -c user.email=ci@example.com commit -q --allow-empty -m "not on master"
          ! bash scripts/release_gate.sh "py-v$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)" --base origin/master

  # L4: every implementation is checked against one suite. Adding a language
  # means adding a row here and an adapter under conformance/adapters/.
  conformance-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: python
            adapter: ""
          # The out-of-process adapter is what scripts/verify_published.py drives
          # after a release. Exercised here too, or it would rot unnoticed until
          # a publish had already happened.
          - lang: python-adapter
            adapter: "--adapter cmd --cmd 'python conformance/adapters/python.py'"
          - lang: node
            adapter: "--adapter cmd --cmd 'node conformance/adapters/node.mjs'"
          - lang: go
            adapter: "--adapter cmd --cmd /tmp/gtc-adapter"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          node packages/node/scripts/sync-data.mjs
          bash packages/go/scripts/sync-data.sh
          cd packages/go && CGO_ENABLED=0 go build -o /tmp/gtc-adapter ./cmd/conformance-adapter

      - name: Conformance (${{ matrix.lang }})
        run: python conformance/run.py ${{ matrix.adapter }}

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Sync the dataset and test
        working-directory: packages/node
        run: |
          node scripts/sync-data.mjs
          node --test

      # The Node package must stay dependency-free too.
      - name: Assert no dependencies
        run: |
          DEPS=$(node -p "Object.keys(require('./packages/node/package.json').dependencies||{}).join(',')")
          if [ -n "$DEPS" ]; then
            echo "::error::@geotoolcn/core should have no dependencies, got: $DEPS"
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "stable"

      # The committed copy under packages/go/data is what `go get` serves.
      # Compare it before sync-data.sh overwrites it, or a stale copy would be
      # tested as if it were current and only show up after a release.
      - name: The Go module's dataset is the one the repository ships
        run: |
          cmp GeoToolCN/data/china.full.gtc packages/go/data/china.full.gtc
          cmp GeoToolCN/data/china_admin.json packages/go/data/china_admin.json

      - name: Vet and test
        working-directory: packages/go
        run: |
          go vet ./...
          # -race needs cgo, so this job is the one place CGO stays on. The
          # geometry cache is filled lazily from whichever goroutine gets
          # there first; the race detector is what caught it being unguarded.
          go test -race ./...

      # No cgo is the point: it is what keeps cross-compilation working, which
      # the Go ecosystem expects of a library like this.
      - name: Cross-compile without cgo
        working-directory: packages/go
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build ./... || exit 1
            echo "built $target"
          done
