name: Test

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  validate-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Guards the bundled GeoJSON/admin data against corruption and against
      # structural regressions introduced by a DataV refresh.
      - name: Validate bundled data
        run: python scripts/validate_data.py

      - name: Check line endings
        run: python scripts/check_line_endings.py

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The contract every port is held to. Failures here mean either a
      # regression or an entry missing from conformance/known-divergences.yaml.
      - name: Run conformance suite
        run: python conformance/run.py

      # The suite is generated from this implementation, so it must reproduce
      # byte-for-byte. A diff means the implementation changed without the
      # golden set being regenerated and reviewed.
      - name: Check the suite is up to date
        run: |
          python conformance/generate.py
          if ! git diff --quiet -- conformance/; then
            echo "::error::conformance 数据集与当前实现不一致。"
            echo "请运行 python conformance/generate.py，审阅 diff 后提交。"
            git diff --stat -- conformance/
            exit 1
          fi

  no-runtime-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The whole point of version 3. Installing without extras must pull in
      # nothing, and the package must work with geopandas absent entirely.
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Assert no third-party dependencies
        run: |
          REQUIRES=$(pip show geotool-cn | grep '^Requires:' | cut -d: -f2- | tr -d ' ')
          if [ -n "$REQUIRES" ]; then
            echo "::error::geotool-cn should have no runtime dependencies, got: $REQUIRES"
            exit 1
          fi
          python - <<'PY'
          import sys
          for blocked in ("geopandas", "shapely", "pandas", "numpy"):
              sys.modules[blocked] = None      # force ImportError on use
          import GeoToolCN
          result = GeoToolCN.reverse(39.9042, 116.4074)
          assert result.district.name == "东城区", result
          assert len(GeoToolCN.get_administrative_tree()) == 34
          print("ok, no geospatial stack required")
          PY

      - name: Report installed size
        run: |
          python - <<'PY'
          import os, GeoToolCN
          root = os.path.dirname(GeoToolCN.__file__)
          total = sum(
              os.path.getsize(os.path.join(dirpath, name))
              for dirpath, _, names in os.walk(root)
              for name in names
          )
          print(f"installed: {total / 1048576:.2f} MB")
          assert total < 8 * 1048576, "package grew beyond 8 MB"
          PY
