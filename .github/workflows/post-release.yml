name: Post-release

# Everything in test.yml runs against the working tree. Publishing is not a
# copy — it rewrites the version from the tag, applies a `files` whitelist, and
# reaches only what git tracks — so a package can be broken in ways no
# pre-release check can see. 3.0.0rc1 passed all twelve of them and then
# reported itself as 2.1.0 once installed.
#
# This installs each ecosystem the way a user does, then runs the same 38k
# conformance suite against it.

on:
  # Called by release.yml right after a publish, with the version it just cut.
  workflow_call:
    inputs:
      ecosystems:
        type: string
        required: true
      version:
        type: string
        required: false
      wait:
        type: number
        default: 300

  workflow_dispatch:
    inputs:
      ecosystems:
        description: "Comma-separated: python,node,go,cli — or all"
        default: all
      version:
        description: "Version to verify (blank = whatever the registry serves as latest)"
        required: false

  # Nothing here depends on this repository's code, so it can break without a
  # commit: a yanked version, an expired token that silently published nothing,
  # a registry serving a truncated tarball. A daily run notices.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ecosystem: [python, node, go, cli]
    steps:
      - name: Is this ecosystem in scope?
        id: scope
        env:
          REQUESTED: ${{ inputs.ecosystems || 'all' }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
        run: |
          if [ "$REQUESTED" = "all" ] || echo ",$REQUESTED," | grep -q ",$ECOSYSTEM,"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$ECOSYSTEM not requested ($REQUESTED), skipping"
          fi

      # The checkout supplies the conformance cases and the adapters. It must
      # not supply the implementation — verify_published.py asserts that every
      # artifact it loads resolves outside this directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run == 'true'

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.scope.outputs.run == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.run == 'true' && matrix.ecosystem == 'node'
        with:
          node-version: "22"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.run == 'true' && matrix.ecosystem == 'go'
        with:
          go-version: "stable"

      - name: Verify the published ${{ matrix.ecosystem }} package
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ECOSYSTEM: ${{ matrix.ecosystem }}
          VERSION: ${{ inputs.version }}
          WAIT: ${{ inputs.wait || 0 }}
        run: |
          # An array, and an `if` rather than `[ … ] && …`: under `set -e` the
          # && form exits the step when VERSION is empty, which is the default.
          args=(--only "$ECOSYSTEM" --wait "$WAIT")
          if [ -n "$VERSION" ]; then
            args+=(--version "$VERSION")
          fi
          python scripts/verify_published.py "${args[@]}"

  # The daily run only exists to notice breakage nobody caused, so its failure
  # has to reach someone. A red run in the Actions tab reaches nobody. This
  # opens one issue per breakage and comments on it while the breakage lasts;
  # a fixed package closes it on the next green day.
  alert:
    needs: verify
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OUTCOME: ${{ needs.verify.result }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          label="post-release-failure"
          gh label create "$label" --color d73a4a --force \
            --description "The daily check of the published packages is failing" >/dev/null
          existing=$(gh issue list --label "$label" --state open --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --comment "Green again: $RUN_URL"
            fi
            exit 0
          fi
          body=$(printf '%s\n\n%s' \
            "The scheduled verification of the published packages failed: $RUN_URL" \
            "Nothing in the repository changed — this is a registry, a token or a yanked version. See docs/RELEASING.md § 发布后验证.")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "Published packages fail verification" --label "$label" --body "$body"
          fi

  # Two things the daily run must also watch, because they break before any
  # package does.
  #
  # GitHub disables a scheduled workflow after 60 days without a commit — in
  # exactly the quiet period this run exists for. Re-enabling it from inside
  # the run resets that clock.
  #
  # NPM_TOKEN has an expiry (npm caps write tokens at 90 days) and after that
  # only the npm publish job fails, with a 401, on the day someone tags a
  # release. `npm whoami` finds out today instead.
  watchdog:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Keep the schedule alive
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/post-release.yml/enable"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: The npm token still authenticates
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set — npm-v* releases will fail"
            exit 1
          fi
          npm whoami

      # The expiry is known in advance (docs/RELEASING.md). Two weeks of red
      # runs beforehand beats one red release afterwards. Move the date when
      # the token is renewed, or delete this step once trusted publishing
      # replaces the token.
      - name: The npm token is not about to expire
        run: |
          expires="2026-12-09"
          warn_from=$(date -u -d "$expires - 14 days" +%s)
          now=$(date -u +%s)
          if [ "$now" -ge "$warn_from" ]; then
            echo "::error::NPM_TOKEN expires on $expires — renew it or switch to trusted publishing (docs/RELEASING.md)"
            exit 1
          fi
          echo "NPM_TOKEN valid until $expires"
