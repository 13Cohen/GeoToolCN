name: Release

on:
  push:
    tags:
      - "py-v*"
      - "npm-v*"
      - "go-v*"
      - "cli-v*"
      - "data-*"
  workflow_dispatch:

# Each ecosystem publishes from its own tag prefix, so a Python release does not
# drag the Node package along with it.
jobs:
  python:
    if: startsWith(github.ref_name, 'py-v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set version from the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#py-v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

  node:
    if: startsWith(github.ref_name, 'npm-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Set version and bundle the dataset
        working-directory: packages/node
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          npm version "${REF_NAME#npm-v}" --no-git-tag-version
          node scripts/sync-data.mjs
      - run: npm publish --access public
        working-directory: packages/node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  go-mirror:
    # Go modules resolve straight from git tags, and a module in a monorepo
    # subdirectory would force the import path .../GeoToolCN/packages/go with
    # tags shaped packages/go/v1.0.0. Pushing to a read-only mirror keeps
    # `go get github.com/13Cohen/geotoolcn-go` clean.
    if: startsWith(github.ref_name, 'go-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push packages/go to the mirror repository
        env:
          MIRROR_TOKEN: ${{ secrets.GO_MIRROR_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${REF_NAME#go-}"
          bash packages/go/scripts/sync-data.sh
          git config --global user.name "geotoolcn-bot"
          git config --global user.email "noreply@github.com"
          rm -rf /tmp/mirror && mkdir /tmp/mirror
          cp -r packages/go/. /tmp/mirror/
          cp LICENSE SPEC.md /tmp/mirror/
          cd /tmp/mirror
          git init -q && git add -A
          git commit -q -m "Release $VERSION"
          git tag "$VERSION"
          git push --force "https://x-access-token:${MIRROR_TOKEN}@github.com/13Cohen/geotoolcn-go.git" HEAD:master --tags

  cli:
    if: startsWith(github.ref_name, 'cli-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build a static binary per platform
        working-directory: packages/go
        env:
          CGO_ENABLED: "0"
          REF_NAME: ${{ github.ref_name }}
        run: |
          bash scripts/sync-data.sh
          VERSION="${REF_NAME#cli-v}"
          mkdir -p /tmp/dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/}
            ext=""
            [ "$GOOS" = "windows" ] && ext=".exe"
            GOOS=$GOOS GOARCH=$GOARCH go build -trimpath \
              -ldflags="-s -w -X main.version=$VERSION" \
              -o "/tmp/dist/geotoolcn-$GOOS-$GOARCH$ext" ./cmd/geotoolcn
          done
          ls -la /tmp/dist

      - uses: softprops/action-gh-release@v2
        with:
          files: /tmp/dist/*

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/13cohen/geotoolcn:latest
            ghcr.io/13cohen/geotoolcn:${{ github.ref_name }}
