[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "geotool-cn"
version = "3.0.0"
description = "Offline geocoding and reverse geocoding for Chinese administrative regions"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Cohen" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
# No runtime dependencies. Version 2 needed geopandas + shapely (~135 MB
# installed); the spatial index is now precomputed into the bundled .gtc, so
# a lookup is a binary search plus, at most, a couple of ray casts.
dependencies = []

[project.optional-dependencies]
# Only for rebuilding the data and running the differential test against the
# geopandas reference implementation. Not needed to use the library.
dev = [
    "geopandas>=0.14",
    "shapely>=2",
    "numpy",
    "pytest",
    "pyyaml",
]

[project.urls]
Homepage = "https://github.com/13Cohen/GeoToolCN"
Issues = "https://github.com/13Cohen/GeoToolCN/issues"

[tool.setuptools.packages.find]
include = ["GeoToolCN*"]

[tool.setuptools.package-data]
# The GeoJSON stays in the repository for the build pipeline but is not
# shipped: it is 28 MB against 6 MB for the .gtc built from it.
GeoToolCN = ["data/*.gtc", "data/china_admin.json", "data/DATA_VERSION.json"]

[tool.setuptools.exclude-package-data]
# Stated explicitly as well: a stale egg-info/SOURCES.txt from an earlier build
# will otherwise drag the GeoJSON back in, quadrupling the wheel.
GeoToolCN = ["data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
